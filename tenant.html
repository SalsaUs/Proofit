<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tenant - ProofIt</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="phone-frame">
  <div class="app">

    <div class="top-bar">
      <div class="top-left">
        <button class="home-btn" onclick="goHome()">
          <img src="images/home.png" alt="Home">
        </button>
      </div>

      <div class="top-center">
        <h2>New Move-In Report</h2>
      </div>

      <div class="top-right">
        <span class="badge">Tenant</span>
      </div>
    </div>

    <div class="form-container">
      <h1>Let's get started</h1>
      <p class="helper">Fill in your details before the walkthrough</p>

      <div class="info-box">
        Your completed report will be emailed to you.
      </div>

      <label>PROPERTY ADDRESS</label>
      <input id="address" type="text" class="address-input" />

      <div class="row">
        <div>
          <label>YOUR NAME</label>
          <input id="tenantName" type="text" class="name-input" />
        </div>
        <div>
          <label>YOUR EMAIL</label>
          <input id="tenantEmail" type="email" class="email-input" />
        </div>
      </div>

      <label>LEASE START DATE</label>
      <input id="inspectionDate" type="date" class="date-input" />

      <button class="primary-btn" onclick="startWalkthrough()">
        Start Walkthrough →
      </button>
    </div>

  </div>
</div>

<script src="script.js"></script>

<script>
  // SAVE DATA
  function saveReportData() {
    const data = {
      address: document.getElementById("address")?.value || "",
      tenantName: document.getElementById("tenantName")?.value || "",
      tenantEmail: document.getElementById("tenantEmail")?.value || "",
      inspectionDate: document.getElementById("inspectionDate")?.value || ""
    };

    localStorage.setItem("reportData", JSON.stringify(data));
  }

  // LOAD DATA BACK INTO INPUTS
  function loadReportData() {
    const data = JSON.parse(localStorage.getItem("reportData"));
    if (!data) return;

    if (document.getElementById("address"))
      document.getElementById("address").value = data.address || "";

    if (document.getElementById("tenantName"))
      document.getElementById("tenantName").value = data.tenantName || "";

    if (document.getElementById("tenantEmail"))
      document.getElementById("tenantEmail").value = data.tenantEmail || "";

    if (document.getElementById("inspectionDate"))
      document.getElementById("inspectionDate").value = data.inspectionDate || "";
  }

  // AUTO SAVE WHEN TYPING
  document.addEventListener("input", saveReportData);

  // LOAD WHEN PAGE OPENS
  window.addEventListener("DOMContentLoaded", loadReportData);
</script>

</body>
</html>
<script src="script.js?v=2"></script>
</body>
</html>
